<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Test: ES module</title></head>
<body style="font-family:system-ui;max-width:520px;margin:32px auto">
<h1>ES module</h1>
<label for="manual">Manual (import + options)</label>
<input type="text" id="manual">
<p>Auto-init (class):</p>
<input type="text" class="country-select" id="auto" value="CY" aria-label="Auto">
<pre id="out"></pre>
<script type="module">
    import CountrySelect, {CountrySelect as Named} from '../dist/country-select.mjs';
    const cs = new CountrySelect('#manual', {defaultCountry: 'GR', preferredCountries: ['GR', 'CY'], lang: 'el'});
    await cs.ready;
    window.__esm = {
        same: CountrySelect === Named && CountrySelect === window.CountrySelect,
        version: CountrySelect.version,
        manual: cs.getCountry(),
        auto: CountrySelect.getInstance('#auto') && CountrySelect.getInstance('#auto').getValue()
    };
    document.getElementById('out').textContent = JSON.stringify(window.__esm, null, 2);
</script>
</body>
</html>
