<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <!-- Αυστηρό CSP: χωρίς 'unsafe-inline' για styles → ένα <style> από JS θα μπλοκαριζόταν -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self' https://cdn.jsdelivr.net; script-src 'self'">
    <title>Test: CSS file + strict CSP</title>
    <link rel="stylesheet" href="../dist/country-select.css">
</head>
<body>
<h1>dist/country-select.css under a strict CSP</h1>
<input type="text" class="country-select" id="c" value="GR" aria-label="Country" data-preferred="GR,CY">
<script src="../dist/country-select.js"></script>
</body>
</html>
