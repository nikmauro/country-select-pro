<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript API – CountrySelect Pro examples</title>
    <meta name="description" content="CountrySelect Pro JavaScript API: options, setValue, getCountry, setCountries from a function, events.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        // Global defaults – before the script
        window.CountrySelectConfig = {preferredCountries: ['GR', 'CY']};
    </script>
</head>
<body class="bg-body-tertiary">
<main class="container py-4" style="max-width: 760px">
    <p><a href="./">← All examples</a></p>
    <h1 class="h3">JavaScript API</h1>

    <section class="card card-body mb-4">
        <h2 class="h6">Manual init with options (no <code>country-select</code> class)</h2>
        <label class="form-label" for="country">Country</label>
        <input type="text" id="country" name="country">
        <div class="btn-group btn-group-sm mt-2 flex-wrap" role="group" aria-label="API calls">
            <button type="button" class="btn btn-outline-primary" id="b-set">setValue('IT')</button>
            <button type="button" class="btn btn-outline-primary" id="b-silent">setValue('FR', {silent: true})</button>
            <button type="button" class="btn btn-outline-primary" id="b-get">getCountry()</button>
            <button type="button" class="btn btn-outline-primary" id="b-list">setCountries(fn)</button>
            <button type="button" class="btn btn-outline-danger" id="b-destroy">destroy()</button>
        </div>
    </section>

    <section class="card card-body">
        <h2 class="h6">Log</h2>
        <pre class="small mb-0" id="log" style="height: 14rem; overflow: auto" aria-live="polite"></pre>
    </section>

    <pre class="small bg-dark text-light rounded p-3 mt-4" id="source"></pre>
</main>

<!-- CDN: https://cdn.jsdelivr.net/npm/country-select-pro@6.2.0/dist/country-select.min.js -->
<script src="../../dist/country-select.js"></script>
<script id="demo">
const log = (msg) => { document.getElementById('log').textContent = msg + '\n' + document.getElementById('log').textContent; };

let cs = new CountrySelect('#country', {
    defaultCountry: 'GR',
    lang: 'en',
    schemaReturn: '{img} {name} ({code})',
    placeholder: 'Choose…'
});
cs.ready.then(() => log('ready → ' + JSON.stringify(cs.getCountry())));

document.getElementById('country').addEventListener('country-change', (e) => log('country-change → ' + e.detail.value));

document.getElementById('b-set').onclick = () => cs.setValue('IT');
document.getElementById('b-silent').onclick = () => { cs.setValue('FR', {silent: true}); log('setValue FR (silent – no event)'); };
document.getElementById('b-get').onclick = () => log('getCountry() → ' + JSON.stringify(cs.getCountry()));
document.getElementById('b-list').onclick = () => cs.setCountries(async () => {
    // e.g. return (await fetch('/api/countries')).json();
    return ['GR', 'CY', 'MT', {value: 'OTHER', name: 'Other country', flag: false}];
}).then(() => log('setCountries → ' + cs.countries.length + ' items'));
document.getElementById('b-destroy').onclick = () => { cs.destroy(); log('destroyed – plain input again'); };
</script>
<script>
    document.getElementById('source').textContent = document.getElementById('demo').textContent.trim();
</script>
</body>
</html>
